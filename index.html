<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard PPK HRMIS - SK Kebun Baharu</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding: 20px; }

        .header-bar {
            max-width: 1100px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .header-title h1 { font-size: 1.4rem; color: #0284c7; }
        .header-title p { font-size: 0.85rem; color: #64748b; }

        .btn-group { display: flex; gap: 10px; }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-print { background-color: #0284c7; color: white; }
        .btn-print:hover { background-color: #0369a1; }

        .btn-back { background-color: #e2e8f0; color: #334155; }
        .btn-back:hover { background-color: #cbd5e1; }

        /* Dashboard Container */
        .dashboard-card {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #0284c7;
        }

        .stat-box h3 { font-size: 0.85rem; color: #64748b; text-transform: uppercase; }
        .stat-box .number { font-size: 1.8rem; font-weight: 700; color: #0f172a; margin-top: 5px; }

        /* Hide buttons during print */
        @media print {
            .header-bar, .btn-group { display: none !important; }
            body { background: white; padding: 0; }
            .dashboard-card { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

    <!-- BAR ATAS: HEADER & BUTANG KAWALAN -->
    <div class="header-bar">
        <div class="header-title">
            <h1>DASHBOARD PPK HRMIS</h1>
            <p>SK Kebun Baharu — Pengurusan Maklumat & Laporan</p>
        </div>
        <div class="btn-group">
            <!-- Butang Cetak Manual (Hanya bila ditekan sahaja) -->
            <button class="btn-action btn-print" onclick="window.print()">
                <i class="fa-solid fa-print"></i> Cetak / Simpan PDF
            </button>
            <!-- Butang Kembali ke Portal Utama -->
            <a href="https://elly-suhailee.github.io/portal/" class="btn-action btn-back">
                <i class="fa-solid fa-house"></i> Portal Utama
            </a>
        </div>
    </div>

    <!-- KANDUNGAN UTAMA DASHBOARD -->
    <div class="dashboard-card">
        
        <!-- RINGKASAN REKOD -->
        <div class="stats-grid">
            <div class="stat-box" style="border-color: #0284c7;">
                <h3>Jumlah Anggota (PPK)</h3>
                <div class="number">--</div>
            </div>
            <div class="stat-box" style="border-color: #10b981;">
                <h3>Penyemakan Selesai</h3>
                <div class="number">--</div>
            </div>
            <div class="stat-box" style="border-color: #f59e0b;">
                <h3>Dalam Proses</h3>
                <div class="number">--</div>
            </div>
            <div class="stat-box" style="border-color: #ef4444;">
                <h3>Tindakan Belum Selesai</h3>
                <div class="number">--</div>
            </div>
        </div>

        <!-- RUANGAN PAPARAN DATA / EMBED LOOKER STUDIO -->
        <div style="text-align: center; padding: 40px 20px; background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 12px;">
            <i class="fa-solid fa-chart-column" style="font-size: 3rem; color: #94a3b8; margin-bottom: 15px;"></i>
            <h2 style="font-size: 1.2rem; color: #334155; margin-bottom: 8px;">Paparan Data Dashboard PPK HRMIS</h2>
            <p style="color: #64748b; font-size: 0.9rem;">Sistem sedia untuk digunakan. Tiada gangguan popup cetak secara automatik.</p>
        </div>

    </div>

</body>
</html>
